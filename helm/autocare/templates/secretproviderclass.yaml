{{/*
SecretProviderClass - retrieves the AutoCare database secret from AWS
Secrets Manager via the AWS Secrets and Configuration Provider (ASCP) and
the Secrets Store CSI Driver.

Prerequisites (installed by the infrastructure layer, NOT by this chart):
  - Secrets Store CSI Driver installed in the cluster
  - ASCP (secrets-store-csi-driver-provider-aws) installed in the cluster
  - An IAM role (via IRSA or EKS Pod Identity) granted secretsmanager:GetSecretValue
    scoped to the specific secret named in .Values.secrets.awsSecretName, and
    bound to the ServiceAccount created by templates/serviceaccount.yaml.

secretObjects synchronizes the retrieved values into a real Kubernetes
Secret (.Values.secrets.syncSecretName) so the Deployment can consume them
via standard secretKeyRef environment variables.
*/}}
{{- if .Values.secrets.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.secretProviderClass.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autocare.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secrets.awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DB_HOST"
            objectAlias: "DB_HOST"
          - path: "DB_PORT"
            objectAlias: "DB_PORT"
          - path: "DB_NAME"
            objectAlias: "DB_NAME"
          - path: "DB_USERNAME"
            objectAlias: "DB_USERNAME"
          - path: "DB_PASSWORD"
            objectAlias: "DB_PASSWORD"
    {{- if .Values.secrets.region }}
    region: {{ .Values.secrets.region | quote }}
    {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.syncSecretName }}
      type: Opaque
      labels:
        {{- include "autocare.labels" . | nindent 8 }}
      data:
        - objectName: "DB_HOST"
          key: DB_HOST
        - objectName: "DB_PORT"
          key: DB_PORT
        - objectName: "DB_NAME"
          key: DB_NAME
        - objectName: "DB_USERNAME"
          key: DB_USERNAME
        - objectName: "DB_PASSWORD"
          key: DB_PASSWORD
{{- end }}
