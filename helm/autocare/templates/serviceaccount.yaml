{{/*
Dedicated ServiceAccount for the AutoCare pods (never "default").

- For IRSA: set serviceAccount.annotations."eks.amazonaws.com/role-arn" via values.
- For EKS Pod Identity: leave annotations empty; the infrastructure layer
  associates an IAM role with this ServiceAccount's name/namespace out-of-band
  (aws eks-pod-identity-association), and no annotation is required here.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autocare.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autocare.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
