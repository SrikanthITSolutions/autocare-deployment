# =============================================================================
# AutoCare - production environment overrides.
# Merged on top of values.yaml: helm upgrade --install -f values.yaml -f values-prod.yaml
# =============================================================================

environment: prod

replicaCount: 2

image:
  pullPolicy: IfNotPresent

config:
  springProfilesActive: prod
  extra:
    DEMO_DATA_ENABLED: "false"

secrets:
  secretProviderClass:
    name: "autocare-prod-database-secrets"
  awsSecretName: "autocare/prod/database"
  syncSecretName: "autocare-prod-db-credentials"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  scheme: internet-facing
  hostname: ""             # optional custom hostname (requires Route 53 + ACM DNS validation); leave empty to use the ALB's auto-generated DNS name
  certificateArn: ""        # set to an ACM certificate ARN to enable HTTPS (443) - optional future enhancement
  sslRedirect: false        # set to true once certificateArn is configured, to force HTTP -> HTTPS
